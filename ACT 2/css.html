<!DOCTYPE html>
<html>

<head>
<title>CSS Basic</title>

<style>
  .request-now {
    background-color: rgb(0, 0, 0);
    color: white;
    border: none;
    padding-right: 16px;
    padding-left: 16px;
    padding-top: 10px;
    padding-bottom: 10px;
    border-radius: 2px;
    cursor: pointer;
    margin-right: 8px;
  }

  .addtocart {
    background-color: rgb(255, 216, 20);
    color: rgb(0, 0, 0);
    border: none;
    height: 36px;
    width: 150px;
    border-radius: 18px;
    font-size: 15px;
    cursor: pointer;
    margin-left: 8px;
    margin-right: 8px;
    
}

  .signup {
    background-color: rgb(46, 164, 79);
    color: white;
    border: none;
    padding-right: 16px;
    padding-left: 16px;
    padding-top: 10px;
    padding-bottom: 10px;
    border-radius: 8px;
    cursor: pointer;
    margin-right: 50px;
  }

    .getstarted {
    background-color: rgb(121, 82, 179);
    color: white;
    border: none;
    padding-right: 16px;
    padding-left: 16px;
    padding-top: 10px;
    padding-bottom: 10px;
    border-radius: 8px;
    cursor: pointer;
    margin-right: 5px;
  }

    .download {
    background-color: rgb(255, 255, 255);
    color: rgb(74, 71, 71);
    border-color: rgb(74, 71, 71);
    border-style: solid;
    border-width: 1px;
    padding-right: 16px;
    padding-left: 16px;
    padding-top: 10px;
    padding-bottom: 10px;
    border-radius: 8px;
    cursor: pointer;
  }

  .apply {
    background-color: rgb(10, 102, 194);
    color: rgb(255, 255, 255);
    border: none;
    height: 36px;
    width: 250px;
    border-radius: 18px;
    font-weight: bold;
    font-size: 15px;
    cursor: pointer;
    margin-left: 50px;
    margin-right: 5px;
    
}

  .save {
    background-color: rgb(255, 255, 255);
    color: rgb(10, 102, 194);
    border-color: rgb(10, 102, 194);
    border-style: solid;
    border-width: 1px;
    height: 36px;
    width: 70px;
    border-radius: 18px;
    font-weight: bold;
    font-size: 15px;
    cursor: pointer;
    margin-right: 8px;
    
}

</style>
</head>
<body>

<button class="request-now">
  Request now
</button>

<button class="addtocart">
  Add To Cart
</button>

<button class="signup">
  Sign up 
</button>

<button class="getstarted">
  Get started
</button>

<button class="download">
 Download
</button>

<button class="apply">
 Apply on company website
</button>

<button class="save">
 Save
</button>

</body>
</html>
