<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Login Page</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family: Arial, sans-serif;
        }

        body{
            height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            background:url('background.jpg') no-repeat center center/cover;
        }

        .login-box{
            width:350px;
            padding:30px;
            background:rgba(255,255,255,0.15);
            border-radius:15px;
            backdrop-filter:blur(8px);
            box-shadow:0 0 15px rgba(0,0,0,0.3);
            text-align:center;
            color:white;
        }

        .login-box h2{
            margin-bottom:25px;
        }

        /* Input Container Box */
        .input-box{
            background:white;
            border:2px solid #ddd;
            border-radius:10px;
            margin:15px 0;
            padding:5px 10px;
        }

        .input-box input{
            width:100%;
            padding:12px;
            border:none;
            outline:none;
            font-size:15px;
            background:transparent;
        }

        .login-btn{
            width:100%;
            padding:12px;
            border:none;
            border-radius:10px;
            background:#035b3e;
            color:white;
            font-size:16px;
            cursor:pointer;
            transition:0.3s;
            margin-top:10px;
        }

        .login-btn:hover{
            background:#02611f;
        }
    </style>
</head>
<body>

    <div class="login-box">
        <h2>Login</h2>

        <form>
            <div class="input-box">
                <input type="text" placeholder="Username" required>
            </div>

            <div class="input-box">
                <input type="password" placeholder="Password" required>
            </div>

            <button type="submit" class="login-btn">Login</button>
        </form>
    </div>

</body>
</html>
